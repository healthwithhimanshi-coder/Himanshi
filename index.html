   --olive-soft:#3D5F5D;  --charcoal:#1C2A29;

:root{
  color-scheme:light only;
  /* 60: warm near-neutrals carry the large surfaces */
  --ivory:#FDF8F2;       /* cream, the page */
  --ivory-warm:#F6ECDF;
  --sage:#F4EADC;        /* oat band */
  --sage-deep:#E4D3BE;
  --moss:#EADCC9;        /* sand band, the deeper one */
  /* 30: the dark that anchors everything */
  --olive:#3E2530;       /* warm espresso-plum ink */
  --olive-mid:#6B4A50;
  --olive-soft:#75565B;
  --charcoal:#2E1F24;
  /* 10: chroma, used only in small moments */
  --clay:#F9DFE3;        /* blush: the one pink surface, kept small */
  --blush:#F7DDE2;       /* pink chips and tints */
  --accent:#D9761C;      /* saffron: fills and buttons */
  --accent-ink:#A93356;  /* rose: labels, numerals, rules */
  --accent-soft:#EFA04A;
  --line:rgba(62,37,48,0.15);
  --line-light:rgba(62,37,48,0.22);
  --max:1180px;
  --gut:clamp(20px,5vw,48px);
  --arch:180px 180px 14px 14px;
}

/* ---------- reset ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;color-scheme:light only;}
body{
  background:var(--ivory);
  color:var(--charcoal);
  font-family:'Manrope',system-ui,sans-serif;
  font-size:16px;
  line-height:1.58;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:2px;}

  line-height:1.06;
  color:var(--olive);
}
